# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: timeshare

before:
  hooks:
    - go mod tidy

builds:
  - id: timeshare
    main: ./cmd/timeshare
    binary: timeshare
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/newtosh/timeshare/internal/version.Version={{.Version}}
      - -X github.com/newtosh/timeshare/internal/version.Commit={{.Commit}}
      - -X github.com/newtosh/timeshare/internal/version.Date={{.Date}}

  - id: timesharedd
    main: ./cmd/timesharedd
    binary: timesharedd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/newtosh/timeshare/internal/version.Version={{.Version}}
      - -X github.com/newtosh/timeshare/internal/version.Commit={{.Commit}}
      - -X github.com/newtosh/timeshare/internal/version.Date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  draft: false
  prerelease: auto
  name_template: "timeshare {{.Tag}}"

# Publishes Casks/timeshare.rb into newtosh/homebrew-tap on each tagged
# release. Requires repo secret HOMEBREW_TAP_TOKEN (Contents: write on the
# tap). Default GITHUB_TOKEN cannot push to another repository.
homebrew_casks:
  - name: timeshare
    binaries:
      - timeshare
      - timesharedd
    homepage: "https://github.com/newtosh/timeshare"
    description: "Repo-scoped, TTL-cached secret bridge for 1Password"
    directory: Casks
    commit_msg_template: "timeshare {{ .Tag }}"
    # Caveats live in custom_block (conditional Ruby). GoReleaser's
    # caveats: key only emits a static heredoc.
    # GoReleaser hooks still emit legacy preflight/postflight; Homebrew
    # wants declarative *_steps (third-party taps warn on the old form).
    # Emit steps via custom_block until GoReleaser grows native keys.
    custom_block: |
      caveats do
        <<~EOS
          timesharedd is spawned automatically by `timeshare` on first use —
          you do not need to start it by hand.
        EOS
        unless which("op")
          <<~EOS
            You also need the 1Password CLI (`op`) installed and signed in:
              https://developer.1password.com/docs/cli/get-started/
          EOS
        end
        <<~EOS
          Release binaries are not Apple-notarized. Install clears the
          Gatekeeper quarantine attribute so first launch is not blocked;
          that weakens quarantine for these two binaries until we ship
          signed builds.
        EOS
      end

      # Refuse if a go-install copy is already first on PATH.
      preflight_steps do
        run "/bin/sh", args: [
          "-c",
          <<~'SH'
            for name in timeshare timesharedd; do
              path=$(command -v "$name" 2>/dev/null) || continue
              # Intel Homebrew puts a symlink at /usr/local/bin; resolve so
              # Cellar/Caskroom paths match (PATH entry alone would not).
              resolved=$(ruby -e 'begin; puts File.realpath(ARGV[0]); rescue; puts ARGV[0]; end' "$path")
              case "$resolved $path" in
                */Cellar/*|*/Caskroom/*|*/opt/homebrew/*|*/Homebrew/*|*/homebrew/*|*/linuxbrew/*) continue ;;
              esac
              printf '%s at %s is not from Homebrew and would shadow this cask.\n' "$name" "$path" >&2
              printf 'Remove it, then re-run brew install:\n  rm -f %s\n' "$path" >&2
              exit 1
            done
          SH
        ]
      end

      # Keep clearing quarantine until notarized builds ship (explicit
      # product choice: first-launch UX over Gatekeeper on these two
      # unsigned CLI binaries). Documented in caveats above.
      # GoReleaser re-templates the rendered cask with missingkey=error, so
      # literal {{staged_path}} would abort the release. Emit Go template
      # that prints the Homebrew steps token Homebrew expands at install.
      postflight_steps do
        # Drop any in-memory timesharedd whose on-disk binary was just
        # replaced; next CLI use respawns from the new install.
        terminate_process "timesharedd"
        on_macos do
          run "/usr/bin/xattr",
              args: ["-dr", "com.apple.quarantine", "{{ "{{" }}staged_path{{ "}}" }}/timeshare"],
              must_succeed: false
          run "/usr/bin/xattr",
              args: ["-dr", "com.apple.quarantine", "{{ "{{" }}staged_path{{ "}}" }}/timesharedd"],
              must_succeed: false
        end
      end
    repository:
      owner: newtosh
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    skip_upload: auto
