version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - gosec
  exclusions:
    rules:
      # Test files: unchecked Close()/os.Remove and permissive tmp-dir
      # permissions are noise, not a real risk in throwaway test fixtures.
      - path: _test\.go
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
