name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: build, vet, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needs to be run on:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Test (race)
        run: go test -race -count=1 ./...

  darwin-cross-compile:
    name: cross-compile darwin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build (darwin/arm64)
        run: GOOS=darwin GOARCH=arm64 go build ./...
        env:
          CGO_ENABLED: 0

      - name: Build (darwin/amd64)
        run: GOOS=darwin GOARCH=amd64 go build ./...
        env:
          CGO_ENABLED: 0
